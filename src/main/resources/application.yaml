spring:
  application:
    name: climalert

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

weatherapi:
  base-url: https://api.weatherapi.com/v1
  key: ${WEATHER_API_KEY:}
  location: Buenos Aires

climalert:
  mail:
    from: ${MAIL_FROM:no-reply@climalert.com}
    recipients: admin@clima.com,emergencias@clima.com,meteorologia@clima.com